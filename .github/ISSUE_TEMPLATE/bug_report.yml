name: Bug report
description: Report a reproducible ShoppyCart UI, catalog or cart issue.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Issue summary
      description: Describe the affected screen or cart behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js, npm, browser and OS versions
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and sanitized console output
    validations:
      required: true
  - type: checkboxes
    id: data-safety
    attributes:
      label: Data safety
      options:
        - label: I have not included customer data, addresses, credentials or payment information.
          required: true
