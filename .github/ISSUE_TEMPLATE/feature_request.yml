name: Feature request
description: Suggest a catalog, cart, accessibility or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Data, dependencies and architecture impact
      description: Clarify if this remains a frontend demo or requires a backend/commerce service.
